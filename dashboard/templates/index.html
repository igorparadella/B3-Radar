</head>

<body>

```
<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <span class="navbar-brand">
            📊 B3 Radar
        </span>

        <span
            id="status"
            class="badge text-bg-secondary"
        >
            Verificando...
        </span>

    </div>
</nav>


<!-- CONTEÚDO -->

<main class="container py-4">

    <!-- CABEÇALHO -->

    <div class="mb-4">

        <h1 class="fw-bold">
            Radar de Ações
        </h1>

        <p class="text-muted mb-0">
            Monitoramento quantitativo e análise auxiliar por IA.
        </p>

    </div>


    <!-- RESUMO -->

    <div class="row g-3 mb-4">

        <div class="col-md-4">

            <div class="card p-4">

                <div class="indicador">
                    Ações analisadas
                </div>

                <div
                    id="total-acoes"
                    class="score"
                >
                    -
                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card p-4">

                <div class="indicador">
                    Maior score
                </div>

                <div
                    id="maior-score"
                    class="score"
                >
                    -
                </div>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card p-4">

                <div class="indicador">
                    Última atualização
                </div>

                <div
                    id="ultima-atualizacao"
                    class="score"
                    style="font-size: 1.2rem;"
                >
                    -
                </div>

            </div>

        </div>

    </div>


    <!-- AÇÕES -->

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2 class="h4 mb-0">
            Ações monitoradas
        </h2>

        <button
            class="btn btn-outline-primary"
            onclick="carregarDados()"
        >
            ↻ Atualizar
        </button>

    </div>


    <div
        id="acoes"
        class="row g-4"
    >

        <div class="loading">

            <div
                class="spinner-border"
                role="status"
            ></div>

            <p class="mt-3">
                Carregando dados...
            </p>

        </div>

    </div>


    <!-- ANÁLISES DA IA -->

    <div class="mt-5 mb-3">

        <h2 class="h4">
            🤖 Análises da IA
        </h2>

        <p class="text-muted">
            Histórico das análises realizadas pelo sistema.
        </p>

    </div>


    <div id="analises">

        <div class="loading">

            <div
                class="spinner-border"
                role="status"
            ></div>

        </div>

    </div>

</main>


<!-- BOOTSTRAP -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<!-- JAVASCRIPT -->

<script>

    async function carregarDados() {

        try {

            const resposta = await fetch(
                "/api/resultado"
            );

            if (!resposta.ok) {
                throw new Error(
                    "Erro ao carregar resultado."
                );
            }

            const dados = await resposta.json();

            mostrarDados(dados);

        } catch (erro) {

            console.error(erro);

            document.getElementById(
                "acoes"
            ).innerHTML = `
                <div class="col-12">
                    <div class="alert alert-danger">
                        Não foi possível carregar os dados.
                    </div>
                </div>
            `;
        }
    }


    function mostrarDados(dados) {

        const acoes =
            dados.acoes || [];


        // TOTAL

        document.getElementById(
            "total-acoes"
        ).textContent = acoes.length;


        // MAIOR SCORE

        let maiorScore = 0;

        if (acoes.length > 0) {

            maiorScore = Math.max(
                ...acoes.map(
                    acao => Number(
                        acao.score || 0
                    )
                )
            );
        }

        document.getElementById(
            "maior-score"
        ).textContent =
            maiorScore.toFixed(1);


        // DATA

        document.getElementById(
            "ultima-atualizacao"
        ).textContent =
            dados.data ||
            "Não disponível";


        // LISTA

        const container =
            document.getElementById(
                "acoes"
            );


        if (acoes.length === 0) {

            container.innerHTML = `
                <div class="col-12">
                    <div class="alert alert-info">
                        Nenhuma ação disponível.
                    </div>
                </div>
            `;

            return;
        }


        container.innerHTML = "";


        acoes.forEach(acao => {

            const score =
                Number(
                    acao.score || 0
                );


            const scoreFormatado =
                score.toFixed(1);


            let badge =
                "text-bg-secondary";


            const classificacao =
                acao.classificacao ||
                "Sem classificação";


            if (score >= 75) {

                badge =
                    "text-bg-success";

            } else if (score >= 50) {

                badge =
                    "text-bg-primary";

            } else if (score >= 30) {

                badge =
                    "text-bg-warning";
            }


            const card = document.createElement(
                "div"
            );

            card.className =
                "col-12 col-md-6 col-xl-4";


            card.innerHTML = `

                <div class="card p-4 h-100">

                    <div class="
                        d-flex
                        justify-content-between
                        align-items-center
                        mb-3
                    ">

                        <span class="ticker">
                            ${escapar(
                                acao.ticker ||
                                "N/A"
                            )}
                        </span>

                        <span class="badge ${badge}">
                            ${scoreFormatado}
                        </span>

                    </div>


                    <div class="mb-3">

                        <span class="badge ${badge}">
                            ${escapar(
                                classificacao
                            )}
                        </span>

                    </div>


                    <div class="row g-3">

                        <div class="col-6">

                            <div class="indicador">
                                Preço
                            </div>

                            <div class="valor">
                                ${formatarNumero(
                                    acao.preco,
                                    2
                                )}
                            </div>

                        </div>


                        <div class="col-6">

                            <div class="indicador">
                                RSI
                            </div>

                            <div class="valor">
                                ${formatarNumero(
                                    acao.rsi,
                                    2
                                )}
                            </div>

                        </div>


                        <div class="col-6">

                            <div class="indicador">
                                Retorno 20D
                            </div>

                            <div class="valor">
                                ${formatarPercentual(
                                    acao.retorno_20d
                                )}
                            </div>

                        </div>


                        <div class="col-6">

                            <div class="indicador">
                                Retorno 60D
                            </div>

                            <div class="valor">
                                ${formatarPercentual(
                                    acao.retorno_60d
                                )}
                            </div>

                        </div>


                        <div class="col-6">

                            <div class="indicador">
                                Volume relativo
                            </div>

                            <div class="valor">
                                ${formatarNumero(
                                    acao.volume_relativo,
                                    2
                                )}
                            </div>

                        </div>


                        <div class="col-6">

                            <div class="indicador">
                                Volatilidade
                            </div>

                            <div class="valor">
                                ${formatarPercentual(
                                    acao.volatilidade
                                )}
                            </div>

                        </div>

                    </div>

                </div>
            `;


            container.appendChild(card);

        });
    }


    async function carregarAnalises() {

        try {

            const resposta = await fetch(
                "/api/analises"
            );

            if (!resposta.ok) {
                throw new Error(
                    "Erro ao carregar análises."
                );
            }

            const dados =
                await resposta.json();


            const container =
                document.getElementById(
                    "analises"
                );


            if (dados.length === 0) {

                container.innerHTML = `
                    <div class="alert alert-info">
                        Ainda não existem análises da IA.
                    </div>
                `;

                return;
            }


            container.innerHTML = "";


            dados.forEach(analise => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "card p-4 mb-3";


                card.innerHTML = `

                    <div class="
                        d-flex
                        justify-content-between
                        mb-3
                    ">

                        <strong>
                            ${escapar(
                                analise.ticker
                            )}
                        </strong>

                        <span class="text-muted">
                            ${escapar(
                                analise.data
                            )}
                        </span>

                    </div>


                    <div class="mb-3">

                        Score:
                        <strong>
                            ${formatarNumero(
                                analise.score,
                                1
                            )}
                        </strong>

                        <span class="ms-2 badge text-bg-secondary">
                            ${escapar(
                                analise.classificacao ||
                                ""
                            )}
                        </span>

                    </div>


                    <div class="ia-box">

                        ${escapar(
                            analise.analise_ia ||
                            "Sem análise disponível."
                        )}

                    </div>

                `;


                container.appendChild(
                    card
                );

            });

        } catch (erro) {

            console.error(erro);

            document.getElementById(
                "analises"
            ).innerHTML = `
                <div class="alert alert-danger">
                    Não foi possível carregar
                    as análises da IA.
                </div>
            `;
        }
    }


    async function verificarStatus() {

        try {

            const resposta = await fetch(
                "/api/status"
            );

            if (!resposta.ok) {
                throw new Error();
            }

            const dados =
                await resposta.json();


            const status =
                document.getElementById(
                    "status"
                );


            status.textContent =
                dados.status === "online"
                    ? "● Online"
                    : "Offline";


            status.className =
                dados.status === "online"
                    ? "badge text-bg-success"
                    : "badge text-bg-danger";

        } catch {

            const status =
                document.getElementById(
                    "status"
                );

            status.textContent =
                "● Offline";

            status.className =
                "badge text-bg-danger";
        }
    }


    function formatarNumero(
        valor,
        casas = 2
    ) {

        if (
            valor === null ||
            valor === undefined ||
            valor === "" ||
            Number.isNaN(Number(valor))
        ) {
            return "-";
        }

        return Number(valor).toLocaleString(
            "pt-BR",
            {
                minimumFractionDigits: casas,
                maximumFractionDigits: casas
            }
        );
    }


    function formatarPercentual(
        valor
    ) {

        if (
            valor === null ||
            valor === undefined ||
            valor === "" ||
            Number.isNaN(Number(valor))
        ) {
            return "-";
        }

        return (
            Number(valor) * 100
        ).toLocaleString(
            "pt-BR",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        ) + "%";
    }


    function escapar(valor) {

        if (
            valor === null ||
            valor === undefined
        ) {
            return "";
        }

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            String(valor);

        return div.innerHTML;
    }


    // Inicialização

    carregarDados();

    carregarAnalises();

    verificarStatus();

</script>

</body>

</html>
